name: hotel_tuperiri
description: 5a Tuperiri Garage Controller

publish_to: 'none'

version: 1.0.0

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.9

  # Networking
  http: ^1.5.0

  # Bluetooth
  flutter_blue_plus: ^1.35.5

  # Haptic feedback
  vibration: ^3.1.3

  # Frosted glass blur
  glassmorphism: ^3.0.0

  # Animations
  animations: ^2.0.11

  # Icons
  flutter_svg: ^2.2.0

  # Secure storage
  flutter_secure_storage: ^9.2.4

  # Shared preferences
  shared_preferences: ^2.5.3

  # Adaptive launcher icons
  flutter_launcher_icons: ^0.14.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true

  assets:
    - assets/

flutter_launcher_icons:

  android: true
  ios: true

  image_path: assets/icon.png

  adaptive_icon_background: "#1B1028"
  adaptive_icon_foreground: assets/icon.png